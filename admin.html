<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journal Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e8;
        --panel: rgba(255, 252, 246, 0.95);
        --line: #e7d5bf;
        --ink: #48524d;
        --muted: #867967;
        --accent: #d9ad78;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 240, 214, 0.65), transparent 36%),
          linear-gradient(180deg, #faf5ed, var(--bg));
        color: var(--ink);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.3vw, 2.2rem);
      }

      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        background: linear-gradient(180deg, #fff9f1, #ffefd9);
        color: #675d50;
        font: inherit;
        cursor: pointer;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 16px 34px rgba(167, 134, 95, 0.12);
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid rgba(231, 213, 191, 0.8);
      }

      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(231, 213, 191, 0.72);
        text-align: left;
        vertical-align: top;
        font-size: 0.93rem;
      }

      th {
        color: var(--muted);
        font-weight: 600;
        background: rgba(255, 248, 239, 0.9);
        position: sticky;
        top: 0;
      }

      tr:hover td {
        background: rgba(255, 249, 240, 0.72);
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: #fff1dd;
        color: #775e3d;
        padding: 4px 9px;
        font-size: 0.78rem;
      }

      a {
        color: #8d6e47;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .status {
        padding: 18px;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .hero,
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <h1>Journal Admin</h1>
          <p class="sub">查看最近创建或更新的手帐，快速打开对应分享链接。</p>
        </div>
        <div class="actions">
          <button id="refresh-btn" type="button">刷新列表</button>
        </div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="meta" id="summary">加载中...</div>
          <div class="meta" id="updated-at"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Journal ID</th>
                <th>Updated</th>
                <th>Created</th>
                <th>Pages</th>
                <th>Elements</th>
                <th>Open</th>
              </tr>
            </thead>
            <tbody id="journal-table-body">
              <tr>
                <td colspan="6" class="status">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const tableBody = document.getElementById("journal-table-body");
      const summary = document.getElementById("summary");
      const updatedAt = document.getElementById("updated-at");
      const refreshBtn = document.getElementById("refresh-btn");

      function fmt(ts) {
        if (!ts) return "-";
        const date = new Date(ts.replace(" ", "T"));
        if (Number.isNaN(date.getTime())) return ts;
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function makeLink(journalId) {
        const url = new URL("/", window.location.origin);
        url.searchParams.set("j", journalId);
        return url.toString();
      }

      function render(items) {
        tableBody.innerHTML = "";
        if (!items.length) {
          tableBody.innerHTML = '<tr><td colspan="6" class="status">还没有任何云端手帐。</td></tr>';
          summary.textContent = "0 本手帐";
          return;
        }

        items.forEach((item) => {
          const tr = document.createElement("tr");

          const journalTd = document.createElement("td");
          journalTd.className = "mono";
          journalTd.textContent = item.journal_id;

          const updatedTd = document.createElement("td");
          updatedTd.textContent = fmt(item.updated_at);

          const createdTd = document.createElement("td");
          createdTd.textContent = fmt(item.created_at);

          const pagesTd = document.createElement("td");
          const pagesPill = document.createElement("span");
          pagesPill.className = "pill";
          pagesPill.textContent = `${item.page_count || 0} pages`;
          pagesTd.appendChild(pagesPill);

          const elementsTd = document.createElement("td");
          elementsTd.textContent = String(item.item_count || 0);

          const openTd = document.createElement("td");
          const a = document.createElement("a");
          a.href = makeLink(item.journal_id);
          a.textContent = "Open";
          a.target = "_blank";
          a.rel = "noreferrer";
          openTd.appendChild(a);

          tr.append(journalTd, updatedTd, createdTd, pagesTd, elementsTd, openTd);
          tableBody.appendChild(tr);
        });

        summary.textContent = `${items.length} 本手帐`;
      }

      async function loadList() {
        tableBody.innerHTML = '<tr><td colspan="6" class="status">加载中...</td></tr>';
        try {
          const endpoint = new URL("/api/admin/journals?limit=200", window.location.origin);
          const res = await fetch(endpoint.toString());
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          render(Array.isArray(data.items) ? data.items : []);
          updatedAt.textContent = `Updated ${new Date().toLocaleTimeString()}`;
        } catch (error) {
          tableBody.innerHTML = `<tr><td colspan="6" class="status">加载失败: ${error.message}</td></tr>`;
          summary.textContent = "加载失败";
        }
      }

      refreshBtn.addEventListener("click", loadList);
      void loadList();
    </script>
  </body>
</html>
